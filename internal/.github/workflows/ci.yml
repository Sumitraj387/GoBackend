name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t user-service:${{ github.sha }} .

      - name: Login to ECR
        run: aws ecr get-login-password ...

      - name: Push to ECR
        run: |
          docker tag user-service:${{ github.sha }} ...
          docker push ...

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        run: helm upgrade --install ...

      - name: Deploy to Prod
        if: github.ref == 'refs/heads/main'
        run: helm upgrade --install ...
